argument_specs:
  main:
    options:
      package_name:
        type: str
        required: true
        description: Package name

      package_title:
        type: str
        required: false
        description: Name used in desktop entry
        default: "{{ package_name }}"

      archive_url:
        type: str
        required: true
        description: URL to the archive

      build_path:
        type: str
        required: false
        description: Location to download and extract archive
        default: "{{ ansible_env.HOME }}/.cache/dotfiles/build/{{ package_name }}"

      icon_name:
        type: str
        required: true
        description: Package icon name (file name without extension)

      icon_file:
        type: str
        required: true
        description: Package icon file
