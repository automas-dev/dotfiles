- name: (New) Install Webots Ubuntu
  when: ansible_facts["distribution"] == "Ubuntu"
  ansible.builtin.deb822_repository:
    name: Cyberbotics
    uris: https://cyberbotics.com/debian
    components:
      - contrib
    suites:
      - binary-amd64
    signed_by: https://cyberbotics.com/Cyberbotics.asc
