- name: Install Bazel Archlinux
  when: ansible_facts["distribution"] == "Archlinux"
  block:
    - name: Install bazel
      become: true
      ansible.builtin.package:
        state: present
        name: bazel

- name: Install Bazel Ubuntu
  when: ansible_facts["distribution"] == "Ubuntu"
  block:
    # - name: Install apt repo
    #   ansible.builtin.import_role:
    #     name: install_apt_repo
    #   vars:
    #     source_name: bazel
    #     source_url: https://storage.googleapis.com/bazel-apt
    #     key_url: https://bazel.build/bazel-release.pub.gpg
    #     distribution: stable
    #     components:
    #       - jdk1.8

    - name: (New) Install Bazel Ubuntu
      ansible.builtin.deb822_repository:
        name: bazel
        uris: https://storage.googleapis.com/bazel-apt
        components:
          - jdk1.8
        suites:
          - stable
        signed_by: https://bazel.build/bazel-release.pub.gpg

    - name: Install Bazel
      become: true
      ansible.builtin.package:
        state: latest
        name: bazel
      tags:
        - skip_ansible_lint
